name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-msvc:
    name: build (windows / msvc)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Report artifact size
        shell: pwsh
        run: |
          $exe = "target/release/heic2img.exe"
          if (-not (Test-Path $exe)) { throw "未找到产物 $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "heic2img.exe = ${mb} MB"
          "SIZE_MB=$mb" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heic2img-${{ github.sha }}
          path: target/release/heic2img.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/heic2img.exe
          generate_release_notes: true
